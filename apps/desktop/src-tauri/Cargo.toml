[package]
name = "nimmd-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
default-run = "nimmd"

[[bin]]
name = "nimmd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
nimmd-assets = { version = "0.1", path = "../../../crates/nimmd-assets" }
nimmd-core = { version = "0.1", path = "../../../crates/nimmd-core" }
same-file = "1"
serde.workspace = true
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.7.3"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["event", "fs", "net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json.workspace = true
libc = "0.2"
notify = "=8.2.0"
time = "=0.3.55"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
