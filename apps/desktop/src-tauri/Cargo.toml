[package]
name = "nimmd-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
default-run = "nimmd"

[[bin]]
name = "nimmd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
nimmd-core = { version = "0.1", path = "../../../crates/nimmd-core" }
same-file = "1"
serde.workspace = true
tauri = { version = "=2.12.7", features = [] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["event", "fs", "net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
