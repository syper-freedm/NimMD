[package]
name = "nimmd-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "nimmd"

[[bin]]
name = "nimmd"
path = "src/main.rs"

[build-dependencies]
# Tauri 2.12 / tauri-build 2.7 требуют Rust 1.90; сохраняем MSRV workspace 1.85.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde.workspace = true
tauri = { version = "=2.11.6", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process"] }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
