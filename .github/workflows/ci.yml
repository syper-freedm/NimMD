# Переносимость с первого дня (спек 9): ядро собирается и проходит тесты на трёх ОС.
# Проверки just lint не зависят от ОС и идут один раз, на Linux.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just clippy
      - run: just test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks проверяет всю историю
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-deny,cargo-machete,zizmor
      - name: Установить semgrep, gitleaks, actionlint, pnpm
        run: | # zizmor: ignore[adhoc-packages] pnpm закреплён точной версией
          pipx install semgrep==1.182.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          npm install -g pnpm@12.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: just lint
