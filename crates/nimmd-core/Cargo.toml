[package]
name = "nimmd-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# benches/inputs.rs — модуль генераторов входов, а не отдельный бенчмарк
autobenches = false

[lib]
name = "nimmd_core"

[lints]
workspace = true

[dependencies]
comrak = { workspace = true }
latex2mathml = { workspace = true }
serde = { workspace = true }
