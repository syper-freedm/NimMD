# Заголовок для Swift / bridging header Quick Look.
language = "C"
header = "/* Autogenerated by cbindgen. Do not edit by hand. */"
autogen_warning = "/* Warning: this file is generated. */"
pragma_once = true
usize_is_size_t = true
style = "type"

[export]
include = [
  "NimmdBuffer",
  "NimmdRenderOptions",
  "NIMMD_RENDER_OPTIONS_VERSION",
  "nimmd_render_html",
  "nimmd_read_asset",
  "nimmd_buffer_free",
]

[parse]
parse_deps = false
