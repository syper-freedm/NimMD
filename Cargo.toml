[workspace]
members = ["crates/nimmd-core", "crates/nimmd-assets"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
comrak = { version = "0.56", default-features = false }
# Подсветка своим адаптером (highlight.rs) по встроенному дампу; движок регулярных выражений на чистом Rust.
# В dev-dependencies ядра добавлены default-syntaxes и yaml-load для сборки дампа (examples/build_syntaxes.rs)
syntect = { version = "5.3", default-features = false, features = ["html", "parsing", "regex-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
latex2mathml = "0.2"   # MathMode::MathML (спек 5.3, В2); MIT
insta = { version = "1.49", features = ["yaml"] }
criterion = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Паника в ядре роняет превью Quick Look: в рабочем коде — Result или явная обработка
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Для nimmd-ffi (план 2): у каждого unsafe-блока комментарий `// SAFETY:`
undocumented_unsafe_blocks = "warn"

# Паника в FFI должна ловиться catch_unwind, а не обрывать процесс Quick Look (спек 5.2, В4)
[profile.release]
panic = "unwind"
